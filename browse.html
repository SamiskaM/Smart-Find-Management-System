<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Found Items | Campus Lost & Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: #f2eee7;
            font-family: "Jost", sans-serif;
        }

        /* ================= TOP BAR ================= */

        .topbar {
            height: 76px;
            padding: 0 45px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(190, 154, 72, 0.25);

            background: #0d0d0d;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            border: 1px solid #b9984e;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #c8a85c;

            font-family: "Cormorant Garamond", serif;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-text h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 21px;
            font-weight: 600;

            color: #f4efe5;
        }

        .brand-text span {
            display: block;

            font-family: "JetBrains Mono", monospace;
            font-size: 9px;

            letter-spacing: 1.8px;
            text-transform: uppercase;

            color: #9c8c6d;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-name {
            color: #b7aa91;
            font-size: 14px;
        }

        .back-btn {
            border: 1px solid rgba(190, 154, 72, 0.45);
            background: transparent;

            color: #d5c49c;

            padding: 9px 16px;

            font-family: "Jost", sans-serif;
            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: rgba(190, 154, 72, 0.08);
            border-color: #c5a45c;
        }

        /* ================= MAIN ================= */

        .page {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;

            padding: 55px 0 70px;
        }

        .page-heading {
            margin-bottom: 35px;
        }

        .page-heading .small-title {
            font-family: "JetBrains Mono", monospace;

            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;

            color: #9c8c6d;

            margin-bottom: 10px;
        }

        .page-heading h1 {
            font-family: "Cormorant Garamond", serif;

            font-size: 46px;
            line-height: 1;

            font-weight: 600;

            color: #f3eee4;
        }

        .page-heading p {
            margin-top: 12px;

            max-width: 650px;

            color: #9f998e;

            font-size: 14px;
            line-height: 1.7;
        }

        /* ================= FILTER AREA ================= */

        .filter-box {
            border: 1px solid rgba(190, 154, 72, 0.22);

            background: #101010;

            padding: 22px;

            margin-bottom: 35px;

            display: grid;

            grid-template-columns: 1fr 230px;

            gap: 18px;
        }

        .filter-group label {
            display: block;

            margin-bottom: 8px;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #9c8c6d;
        }

        .filter-input,
        .filter-select {
            width: 100%;

            height: 44px;

            border: 1px solid #302d27;

            background: #0b0b0b;

            color: #eee8dd;

            padding: 0 13px;

            outline: none;

            font-family: "Jost", sans-serif;

            font-size: 13px;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #9d8042;
        }

        .filter-input::placeholder {
            color: #6e6a62;
        }

        /* ================= ITEMS HEADER ================= */

        .items-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .items-header h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: 27px;

            color: #eee7da;

            font-weight: 600;
        }

        .items-count {
            font-family: "JetBrains Mono", monospace;

            font-size: 10px;

            letter-spacing: 1px;

            color: #8d8679;
        }

        /* ================= ITEMS GRID ================= */

        .items-container {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .item-card {
            border: 1px solid rgba(190, 154, 72, 0.18);

            background: #101010;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);

            border-color: rgba(190, 154, 72, 0.45);
        }

        /* ================= IMAGE ================= */

        .item-image {
            width: 100%;
            height: 210px;

            background: #161616;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .item-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .no-image {
            font-family: "JetBrains Mono", monospace;

            font-size: 10px;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #68635a;
        }

        /* ================= ITEM CONTENT ================= */

        .item-content {
            padding: 20px;
        }

        .item-category {
            display: inline-block;

            margin-bottom: 8px;

            padding: 5px 9px;

            border: 1px solid rgba(190, 154, 72, 0.25);

            color: #bba16a;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .item-title {
            font-family: "Cormorant Garamond", serif;

            font-size: 25px;

            color: #f1ece3;

            font-weight: 600;

            margin-bottom: 12px;
        }

        .item-details {
            display: grid;

            gap: 8px;

            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;

            gap: 8px;

            font-size: 12px;

            color: #9b968c;
        }

        .detail-label {
            min-width: 70px;

            color: #756f65;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .item-description {
            padding-top: 14px;

            border-top: 1px solid #27251f;

            color: #99938a;

            font-size: 12px;

            line-height: 1.6;
        }

        /* ================= EMPTY / LOADING ================= */

        .message-card {
            grid-column: 1 / -1;

            border: 1px solid rgba(190, 154, 72, 0.18);

            background: #101010;

            padding: 55px 25px;

            text-align: center;
        }

        .message-card h3 {
            font-family: "Cormorant Garamond", serif;

            font-size: 27px;

            color: #e9e2d5;

            margin-bottom: 8px;
        }

        .message-card p {
            color: #858077;

            font-size: 13px;
        }

        .loading {
            font-family: "JetBrains Mono", monospace;

            font-size: 11px;

            letter-spacing: 1px;

            color: #a58a52;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .items-container {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .topbar {
                height: auto;

                padding: 18px 20px;

                gap: 15px;

                align-items: flex-start;
            }

            .top-actions {
                flex-direction: column;

                align-items: flex-end;

                gap: 8px;
            }

            .page {
                width: min(100% - 28px, 1200px);

                padding-top: 35px;
            }

            .page-heading h1 {
                font-size: 38px;
            }

            .filter-box {
                grid-template-columns: 1fr;
            }

            .items-container {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <!-- ================= TOP BAR ================= -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                LF
            </div>

            <div class="brand-text">
                <h2>Campus Lost & Found</h2>
                <span>Browse Found Items</span>
            </div>

        </div>

        <div class="top-actions">

            <span class="user-name" id="userName">
                Student
            </span>

            <button
                class="back-btn"
                type="button"
                onclick="window.location.href='profileview.html#dashboard'">

                ← Dashboard

            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="page">

        <section class="page-heading">

            <div class="small-title">
                Found Items
            </div>

            <h1>Browse Items</h1>

            <p>
                Browse items reported as found on campus.
                Use the search and category filter to find items
                that may match something you have lost.
            </p>

        </section>


        <!-- ================= FILTER ================= -->

        <section class="filter-box">

            <div class="filter-group">

                <label for="searchInput">
                    Search Items
                </label>

                <input
                    type="text"
                    id="searchInput"
                    class="filter-input"
                    placeholder="Search by item, color, brand or location...">

            </div>


            <div class="filter-group">

                <label for="categoryFilter">
                    Category
                </label>

                <select
                    id="categoryFilter"
                    class="filter-select">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Documents">
                        Documents
                    </option>

                    <option value="Clothing">
                        Clothing
                    </option>

                    <option value="Personal Items">
                        Personal Items
                    </option>

                    <option value="Others">
                        Others
                    </option>

                </select>

            </div>

        </section>


        <!-- ================= ITEMS ================= -->

        <div class="items-header">

            <h2>Found Items</h2>

            <span
                class="items-count"
                id="itemsCount">
                0 ITEMS
            </span>

        </div>


        <section
            class="items-container"
            id="itemsContainer">

            <div class="message-card">

                <div class="loading">
                    Loading found items...
                </div>

            </div>

        </section>

    </main>


    <script>

        /*
         * ==========================================
         * GET CURRENT USER
         * ==========================================
         */

        function getCurrentUser()
        {
            try
            {
                const user =
                    JSON.parse(
                        sessionStorage.getItem(
                            "campusCurrentUser"
                        )
                    );

                return user || {};

            }
            catch(error)
            {
                return {};
            }
        }


        /*
         * ==========================================
         * LOAD USER NAME
         * ==========================================
         */

        function loadUserName()
        {
            const user = getCurrentUser();

            const nameElement =
                document.getElementById("userName");

            if(user.name)
            {
                nameElement.textContent = user.name;
            }
        }


        /*
         * ==========================================
         * TEMPORARY SAMPLE DATA
         *
         * This will be replaced with the
         * /found-reports API in Step 2.
         * ==========================================
         */

        let foundItems = [];
        async function loadFoundItems(){
            const container =
            document.getElementById("itemsContainer");

            try{
                container.innerHTML = `
                <div class="message-card">
                    <div class="loading">
                        Loading found items...
                    </div>
                </div>
                `;
                const response =
                await fetch("/found-reports");

                const result =
                await response.json();

                if(!response.ok || !result.success)
                {
                    throw new Error(
                    result.error || "Failed to load found items"
                    );
                }

                foundItems = result.reports || [];

                displayItems(foundItems);
            }
            catch(error)
            {
                console.error(
                "❌ Browse items error:",
                error
                );

                container.innerHTML = `
                <div class="message-card">
                    <h3>Unable to Load Items</h3>
                    <p>
                        ${escapeHTML(error.message)}
                    </p>
                </div>
                `;

                document.getElementById("itemsCount").textContent =
                "0 ITEMS";
            }
        }

        /*
         * ==========================================
         * DISPLAY ITEMS
         * ==========================================
         */

        function displayItems(items)
        {
            const container =
                document.getElementById(
                    "itemsContainer"
                );

            const countElement =
                document.getElementById(
                    "itemsCount"
                );


            countElement.textContent =
                `${items.length} ITEM${items.length === 1 ? "" : "S"}`;


            if(items.length === 0)
            {
                container.innerHTML = `

                    <div class="message-card">

                        <h3>No Found Items</h3>

                        <p>
                            There are currently no found items
                            available to browse.
                        </p>

                    </div>

                `;

                return;
            }


            container.innerHTML =
                items.map(item => createItemCard(item)).join("");
        }


        /*
         * ==========================================
         * CREATE ITEM CARD
         * ==========================================
         */

        function createItemCard(item)
        {
            return `

                <article class="item-card">

                    <div class="item-image">

                        <div class="no-image">
                            No Image
                        </div>

                    </div>


                    <div class="item-content">

                        <span class="item-category">
                            ${escapeHTML(item.category || "Other")}
                        </span>

                        <h3 class="item-title">
                            ${escapeHTML(item.item_type || "Found Item")}
                        </h3>


                        <div class="item-details">

                            <div class="detail-row">

                                <span class="detail-label">
                                    Color
                                </span>

                                <span>
                                    ${escapeHTML(item.color || "Not specified")}
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Location
                                </span>

                                <span>
                                    ${escapeHTML(item.location || "Not specified")}
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Date
                                </span>

                                <span>
                                    ${escapeHTML(item.date_found || "Not specified")}
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Time
                                </span>

                                <span>
                                    ${escapeHTML(item.time_found || "Not specified")}
                                </span>

                            </div>

                        </div>


                        <div class="item-description">

                            ${escapeHTML(
                                item.description ||
                                "No public description available."
                            )}

                        </div>

                    </div>

                </article>

            `;
        }


        /*
         * ==========================================
         * SEARCH + CATEGORY FILTER
         * ==========================================
         */

        function filterItems()
        {
            const searchText =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();


            const category =
                document
                    .getElementById("categoryFilter")
                    .value;


            const filtered =
                foundItems.filter(item =>
                {
                    const searchableText = [

                        item.item_type,
                        item.category,
                        item.color,
                        item.brand,
                        item.location,
                        item.description

                    ]
                    .join(" ")
                    .toLowerCase();


                    const matchesSearch =
                        !searchText ||
                        searchableText.includes(searchText);


                    const matchesCategory =
                        category === "all" ||
                        item.category === category;


                    return (
                        matchesSearch &&
                        matchesCategory
                    );
                });


            displayItems(filtered);
        }


        /*
         * ==========================================
         * HTML SAFETY
         * ==========================================
         */

        function escapeHTML(value)
        {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /*
         * ==========================================
         * EVENTS
         * ==========================================
         */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                filterItems
            );


        document
            .getElementById("categoryFilter")
            .addEventListener(
                "change",
                filterItems
            );


        /*
         * ==========================================
         * PAGE START
         * ==========================================
         */

        loadUserName();

        
        loadFoundItems();

    </script>

</body>
</html>
