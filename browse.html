
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items - Campus Lost & Found</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: #f5f5f5;
            min-height: 100vh;
        }

        header {
            background: #111;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #c9a227;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h2 {
            color: #d4af37;
        }

        .back-btn {
            background: #d4af37;
            color: #111;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #f0cf62;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            color: #d4af37;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #aaa;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            padding: 13px;
            border: 1px solid #555;
            border-radius: 7px;
            background: #171717;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #d4af37;
        }

        .item-count {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .item-card {
            background: #151515;
            border: 1px solid #444;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            box-shadow: 0 5px 18px rgba(212, 175, 55, 0.15);
        }

        .item-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #222;
            display: block;
        }

        .no-image {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            color: #aaa;
            font-size: 15px;
        }

        .item-content {
            padding: 18px;
        }

        .item-content h3 {
            color: #d4af37;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .item-content p {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .item-content strong {
            color: #eee;
        }

        .category-tag {
            display: inline-block;
            background: #332b13;
            color: #e5c45c;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .empty-message,
        .error-message,
        .loading-message {
            text-align: center;
            padding: 35px 15px;
            color: #aaa;
            background: #151515;
            border: 1px solid #444;
            border-radius: 10px;
            grid-column: 1 / -1;
        }

        .error-message {
            color: #ff7777;
        }

        .retry-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            margin-top: 50px;
            border-top: 1px solid #333;
        }

        @media (max-width: 650px) {
            .filters {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px 5%;
            }

            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Campus Lost & Found</h2>
    <a href="profileview.html" class="back-btn">Back to Dashboard</a>
</header>

<div class="container">

    <div class="page-title">
        <h1>Browse Found Items</h1>
        <p>Search for items reported as found on campus.</p>
    </div>

    <div class="filters">

        <input
            type="text"
            id="searchInput"
            class="filter-input"
            placeholder="Search by item, color, brand or location..."
        >

        <select id="categoryFilter" class="filter-select">
            <option value="all">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Books">Books</option>
            <option value="Wallet">Wallet</option>
            <option value="ID Card">ID Card</option>
            <option value="Keys">Keys</option>
            <option value="Bag">Bag</option>
            <option value="Clothing">Clothing</option>
            <option value="Accessories">Accessories</option>
            <option value="Documents">Documents</option>
            <option value="Other">Other</option>
        </select>

    </div>

    <p class="item-count" id="itemCount">Loading items...</p>

    <div class="items-grid" id="itemsContainer">
        <div class="loading-message">Loading found items...</div>
    </div>

</div>

<footer>
    Campus Lost & Found Management System
</footer>

<script>
    let foundItems = [];

    const itemsContainer = document.getElementById("itemsContainer");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const itemCount = document.getElementById("itemCount");


    // Prevent HTML injection when displaying database values
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }


    // Format date without changing the calendar day
    function formatDate(value) {
        if (!value) return "Not available";

        const datePart = String(value).split("T")[0];
        const parts = datePart.split("-");

        if (parts.length === 3) {
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        return escapeHTML(value);
    }


    // Display found item cards
    function createItemCard(item) {

        const title = escapeHTML(item.item_type || "Unknown Item");
        const category = escapeHTML(item.category || "Other");
        const color = escapeHTML(item.color || "Not specified");
        const brand = escapeHTML(item.brand || "Not specified");
        const location = escapeHTML(item.location || "Not specified");
        const description = escapeHTML(item.description || "No description provided.");
        const founderEmail = escapeHTML(item.founder_email || "Not available");
        const dateFound = formatDate(item.date_found);
        const timeFound = escapeHTML(item.time_found || "Not available");

        let imageHTML = `
            <div class="no-image">No Image Available</div>
        `;

        // Show image only when a valid image data URL is available
        if (
            typeof item.image_data === "string" &&
            item.image_data.startsWith("data:image/")
        ) {
            imageHTML = `
                <img
                    class="item-image"
                    src="${escapeHTML(item.image_data)}"
                    alt="${title}"
                    onerror="this.style.display='none'"
                >
            `;
        }

        return `
            <div class="item-card">

                ${imageHTML}

                <div class="item-content">

                    <span class="category-tag">${category}</span>

                    <h3>${title}</h3>

                    <p><strong>Color:</strong> ${color}</p>

                    <p><strong>Brand:</strong> ${brand}</p>

                    <p><strong>Location:</strong> ${location}</p>

                    <p><strong>Date Found:</strong> ${dateFound}</p>

                    <p><strong>Time Found:</strong> ${timeFound}</p>

                    <p><strong>Description:</strong> ${description}</p>

                    <p><strong>Reported By:</strong> ${founderEmail}</p>

                </div>

            </div>
        `;
    }


    // Load found items from backend
    async function loadFoundItems() {

        itemsContainer.innerHTML = `
            <div class="loading-message">Loading found items...</div>
        `;

        itemCount.textContent = "Loading items...";

        try {

            const response = await fetch("/found-reports");

            const responseText = await response.text();

            let result;

            try {
                result = JSON.parse(responseText);
            } catch (error) {
                throw new Error(
                    "Server returned an invalid response. Please check the backend."
                );
            }

            if (!response.ok || !result.success) {
                throw new Error(
                    result.error ||
                    result.message ||
                    "Failed to load found items."
                );
            }

            if (!Array.isArray(result.reports)) {
                throw new Error("Invalid found items data received from server.");
            }

            // Show only reports that are still open
            foundItems = result.reports.filter(function(item) {
                return String(item.status || "OPEN").toUpperCase() === "OPEN";
            });

            displayItems();

        } catch (error) {

            console.error("Browse items error:", error);

            itemCount.textContent = "Unable to load items.";

            itemsContainer.innerHTML = `
                <div class="error-message">
                    <p>${escapeHTML(error.message)}</p>
                    <button class="retry-btn" onclick="loadFoundItems()">
                        Try Again
                    </button>
                </div>
            `;
        }
    }


    // Search and category filtering
    function displayItems() {

        const searchText = searchInput.value.trim().toLowerCase();
        const selectedCategory = categoryFilter.value.toLowerCase();

        const filteredItems = foundItems.filter(function(item) {

            const searchableText = [
                item.item_type,
                item.category,
                item.color,
                item.brand,
                item.location,
                item.description
            ].join(" ").toLowerCase();

            const matchesSearch = searchableText.includes(searchText);

            const matchesCategory =
                selectedCategory === "all" ||
                String(item.category || "").toLowerCase() === selectedCategory;

            return matchesSearch && matchesCategory;
        });

        itemCount.textContent =
            `Showing ${filteredItems.length} of ${foundItems.length} found items`;

        if (filteredItems.length === 0) {

            itemsContainer.innerHTML = `
                <div class="empty-message">
                    <h3>No Found Items Available</h3>
                    <p>Try changing your search or category filter.</p>
                </div>
            `;

            return;
        }

        itemsContainer.innerHTML = filteredItems
            .map(createItemCard)
            .join("");
    }


    // Search when user types
    searchInput.addEventListener("input", displayItems);


    // Filter when category changes
    categoryFilter.addEventListener("change", displayItems);


    // Load items when page opens
    document.addEventListener("DOMContentLoaded", loadFoundItems);

    // Also load if this script runs after DOMContentLoaded
    if (document.readyState !== "loading") {
        loadFoundItems();
    }

</script>

</body>
</html>
