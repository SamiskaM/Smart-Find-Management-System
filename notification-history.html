<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notification History - Campus Lost & Found</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #080808,
                    #141414,
                    #080808
                );

            color: #f5f5f5;
            min-height: 100vh;
        }


        /* ==========================================
           TOP BAR
           ========================================== */

        .topbar {
            height: 72px;

            background: #0d0d0d;

            border-bottom:
                1px solid #b58b2a;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.5);
        }


        .brand {
            color: #d4af37;

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        .page-title {
            color: #ffffff;

            font-size: 17px;
        }


        /* ==========================================
           MAIN
           ========================================== */

        .container {
            width: 90%;

            max-width: 1000px;

            margin: 40px auto;
        }


        .back-btn {
            display: inline-block;

            padding: 10px 18px;

            border:
                1px solid #b58b2a;

            border-radius: 8px;

            background: transparent;

            color: #d4af37;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 30px;

            transition: 0.2s;
        }


        .back-btn:hover {
            background: #d4af37;

            color: #000000;
        }


        h1 {
            color: #d4af37;

            font-size: 30px;

            margin-bottom: 10px;
        }


        .subtitle {
            color: #aaaaaa;

            margin-bottom: 30px;

            font-size: 15px;
        }


        /* ==========================================
           SUMMARY
           ========================================== */

        .summary {
            display: flex;

            gap: 15px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }


        .summary-box {
            background: #111111;

            border:
                1px solid #333333;

            border-radius: 10px;

            padding: 15px 20px;

            min-width: 150px;
        }


        .summary-label {
            color: #999999;

            font-size: 12px;

            margin-bottom: 5px;
        }


        .summary-value {
            color: #d4af37;

            font-size: 22px;

            font-weight: bold;
        }


        /* ==========================================
           NOTIFICATION LIST
           ========================================== */

        #notificationList {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .notification-card {
            background: #111111;

            border:
                1px solid #333333;

            border-left:
                4px solid #555555;

            border-radius: 10px;

            padding: 20px;

            transition: 0.2s;
        }


        .notification-card:hover {
            border-color: #b58b2a;

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.35);
        }


        .notification-card.unread {
            border-left-color: #d4af37;
        }


        .notification-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 10px;
        }


        .notification-title {
            color: #ffffff;

            font-size: 17px;

            font-weight: bold;
        }


        .notification-icon {
            margin-right: 8px;
        }


        /* ==========================================
           STATUS BADGES
           ========================================== */

        .status-badge {
            padding: 5px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;

            white-space: nowrap;
        }


        .status-unread {
            background: #3a2c08;

            color: #d4af37;

            border:
                1px solid #b58b2a;
        }


        .status-read {
            background: #202020;

            color: #999999;

            border:
                1px solid #444444;
        }


        .notification-message {
            color: #cccccc;

            line-height: 1.6;

            font-size: 14px;

            margin-bottom: 15px;
        }


        /* ==========================================
           DETAILS
           ========================================== */

        .notification-details {
            display: flex;

            flex-wrap: wrap;

            gap: 20px;

            margin-bottom: 15px;

            padding-top: 12px;

            border-top:
                1px solid #292929;
        }


        .detail {
            font-size: 12px;

            color: #888888;
        }


        .detail strong {
            color: #bbbbbb;
        }


        /* ==========================================
           BUTTON
           ========================================== */

        .view-btn {
            padding: 9px 15px;

            background: #d4af37;

            color: #000000;

            border: none;

            border-radius: 7px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .view-btn:hover {
            background: #f0cf5c;
        }


        /* ==========================================
           EMPTY / LOADING
           ========================================== */

        .empty {
            background: #111111;

            border:
                1px solid #333333;

            border-radius: 10px;

            padding: 40px;

            text-align: center;

            color: #999999;
        }


        .loading {
            color: #d4af37;
        }


        .error {
            color: #ff7777;
        }


        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media(max-width: 700px) {

            .topbar {
                padding: 0 18px;
            }


            .brand {
                font-size: 16px;
            }


            .page-title {
                font-size: 14px;
            }


            .container {
                width: 94%;

                margin: 25px auto;
            }


            h1 {
                font-size: 25px;
            }


            .notification-header {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         TOP BAR
         ========================================== -->

    <div class="topbar">

        <div class="brand">
            CAMPUS LOST & FOUND
        </div>


        <div class="page-title">
            Notification History
        </div>

    </div>



    <!-- ==========================================
         MAIN CONTENT
         ========================================== -->

    <main class="container">


        <a
            href="profileview.html#dashboard"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>


        <h1>
            🔔 Notification History
        </h1>


        <p class="subtitle">
            View your previous notifications and their read status.
        </p>



        <!-- ==========================================
             SUMMARY
             ========================================== -->

        <div class="summary">


            <div class="summary-box">

                <div class="summary-label">
                    Total Notifications
                </div>


                <div
                    class="summary-value"
                    id="totalCount"
                >
                    0
                </div>

            </div>



            <div class="summary-box">

                <div class="summary-label">
                    Unread
                </div>


                <div
                    class="summary-value"
                    id="unreadCount"
                >
                    0
                </div>

            </div>



            <div class="summary-box">

                <div class="summary-label">
                    Read
                </div>


                <div
                    class="summary-value"
                    id="readCount"
                >
                    0
                </div>

            </div>

        </div>



        <!-- ==========================================
             NOTIFICATION LIST
             ========================================== -->

        <div id="notificationList">

            <div class="empty loading">
                Loading notification history...
            </div>

        </div>

    </main>



    <script>


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(value)
        {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }



        // ==========================================
        // FORMAT DATE
        // ==========================================

        function formatDate(dateValue)
        {
            if(!dateValue)
            {
                return "—";
            }


            const date =
                new Date(dateValue);


            if(isNaN(date.getTime()))
            {
                return "—";
            }


            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",

                    month: "short",

                    year: "numeric",

                    hour: "2-digit",

                    minute: "2-digit"
                }
            );
        }



        // ==========================================
        // OPEN NOTIFICATION
        // ==========================================

        async function openNotification(
            notification
        )
        {

            if(!notification)
            {
                return;
            }


            const currentUser =
                JSON.parse(
                    sessionStorage.getItem(
                        "campusCurrentUser"
                    ) || "{}"
                );


            if(!currentUser.id)
            {

                alert(
                    "Please login again."
                );

                return;
            }



            // ======================================
            // MARK AS READ
            // ======================================

            if(
                notification.is_read === false &&
                notification.id
            )
            {

                try
                {

                    const response =
                        await fetch(
                            `/notifications/${notification.id}/read`,
                            {
                                method: "PUT",

                                headers:
                                {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        user_id:
                                            currentUser.id

                                    })
                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "🔔 History read response:",
                        data
                    );

                }
                catch(error)
                {

                    console.error(
                        "❌ Unable to mark notification as read:",
                        error
                    );

                }

            }



            // ======================================
            // OPEN ORIGINAL VERIFICATION
            // ======================================

            if(
                notification.type ===
                "VERIFICATION"
            )
            {

                window.location.href =
                    "verification.html?verification_id=" +
                    notification.verification_id;

                return;

            }



            // ======================================
            // OPEN VERIFICATION RESULT
            // ======================================

            if(
                notification.type ===
                "VERIFICATION_RESULT"
            )
            {

                window.location.href =
                    "verification-result.html?verification_id=" +
                    notification.verification_id;

                return;

            }



            // ======================================
            // OPEN PICKUP CODE
            // ======================================

            if(
                notification.type ===
                "HANDOVER"
            )
            {

                window.location.href =
                    "pickup-code.html";

                return;

            }



            // ======================================
            // UNKNOWN NOTIFICATION
            // ======================================

            alert(
                "No page is available for this notification."
            );

        }



        // ==========================================
        // CREATE NOTIFICATION CARD
        // ==========================================

        function createNotificationCard(
            notification
        )
        {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "notification-card" +
                (
                    notification.is_read
                        ? ""
                        : " unread"
                );



            // ======================================
            // STATUS
            // ======================================

            const statusHTML =
                notification.is_read
                    ?
                    `
                    <span class="status-badge status-read">
                        READ
                    </span>
                    `
                    :
                    `
                    <span class="status-badge status-unread">
                        UNREAD
                    </span>
                    `;



            // ======================================
            // BUTTON TEXT
            // ======================================

            let buttonText =
                "View Notification →";


            if(
                notification.type ===
                "VERIFICATION"
            )
            {

                buttonText =
                    "View Verification →";

            }


            if(
                notification.type ===
                "VERIFICATION_RESULT"
            )
            {

                buttonText =
                    "View Verification Result →";

            }


            if(
                notification.type ===
                "HANDOVER"
            )
            {

                buttonText =
                    "View Pickup Code →";

            }



            // ======================================
            // CARD HTML
            // ======================================

            card.innerHTML =
                `
                <div class="notification-header">

                    <div class="notification-title">

                        <span class="notification-icon">
                            🔔
                        </span>

                        ${escapeHTML(
                            notification.title
                        )}

                    </div>


                    ${statusHTML}

                </div>



                <div class="notification-message">

                    ${escapeHTML(
                        notification.message
                    )}

                </div>



                <div class="notification-details">

                    <div class="detail">

                        <strong>
                            Received:
                        </strong>

                        ${formatDate(
                            notification.created_at
                        )}

                    </div>



                    <div class="detail">

                        <strong>
                            Read:
                        </strong>

                        ${
                            notification.read_at
                                ? formatDate(
                                    notification.read_at
                                )
                                : "Not yet read"
                        }

                    </div>

                </div>



                <button
                    type="button"
                    class="view-btn"
                >
                    ${buttonText}
                </button>

                `;



            // ======================================
            // BUTTON EVENT
            // ======================================

            const button =
                card.querySelector(
                    ".view-btn"
                );


            button.addEventListener(
                "click",
                function()
                {

                    openNotification(
                        notification
                    );

                }
            );


            return card;

        }



        // ==========================================
        // LOAD NOTIFICATION HISTORY
        // ==========================================

        async function loadNotificationHistory()
        {

            const list =
                document.getElementById(
                    "notificationList"
                );


            try
            {

                const currentUser =
                    JSON.parse(
                        sessionStorage.getItem(
                            "campusCurrentUser"
                        ) || "{}"
                    );



                if(!currentUser.id)
                {

                    list.innerHTML =
                        `
                        <div class="empty error">
                            Please login to view notifications.
                        </div>
                        `;

                    return;

                }



                console.log(
                    "🔔 Loading notification history for:",
                    currentUser.id
                );



                const response =
                    await fetch(
                        `/notifications/user/${currentUser.id}`
                    );



                const data =
                    await response.json();



                console.log(
                    "🔔 Notification history:",
                    data
                );



                if(
                    !response.ok ||
                    !data.success
                )
                {

                    throw new Error(
                        data.error ||
                        "Unable to load notifications"
                    );

                }



                const notifications =
                    data.notifications || [];



                // ==================================
                // UPDATE SUMMARY
                // ==================================

                const total =
                    notifications.length;


                const unread =
                    notifications.filter(
                        notification =>
                            notification.is_read === false
                    ).length;


                const read =
                    total - unread;



                document.getElementById(
                    "totalCount"
                ).textContent =
                    total;


                document.getElementById(
                    "unreadCount"
                ).textContent =
                    unread;


                document.getElementById(
                    "readCount"
                ).textContent =
                    read;



                // ==================================
                // EMPTY
                // ==================================

                if(
                    notifications.length === 0
                )
                {

                    list.innerHTML =
                        `
                        <div class="empty">
                            No notification history yet.
                        </div>
                        `;

                    return;

                }



                // ==================================
                // DISPLAY NOTIFICATIONS
                // ==================================

                list.innerHTML = "";


                notifications.forEach(
                    notification =>
                    {

                        const card =
                            createNotificationCard(
                                notification
                            );


                        list.appendChild(
                            card
                        );

                    }
                );

            }
            catch(error)
            {

                console.error(
                    "❌ Notification history error:",
                    error
                );


                list.innerHTML =
                    `
                    <div class="empty error">
                        Unable to load notification history.
                    </div>
                    `;

            }

        }



        // ==========================================
        // PAGE LOAD
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function()
            {

                loadNotificationHistory();

            }
        );

    </script>

</body>

</html>
