<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Lost Reports - Campus Lost & Found</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }

        /* ---------- TOP BAR ---------- */

        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: #080808;
            border-bottom: 1px solid #333333;
        }

        .brand {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
        }

        .page-title {
            font-size: 18px;
            color: #ffffff;
        }

        .back-btn {
            padding: 10px 18px;
            background: transparent;
            color: #d4af37;
            border: 1px solid #b58b2a;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #d4af37;
            color: #000000;
        }

        /* ---------- MAIN ---------- */

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            color: #d4af37;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #aaaaaa;
            font-size: 14px;
        }

        /* ---------- REPORT GRID ---------- */

        .reports-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 25px;
        }

        /* ---------- REPORT CARD ---------- */

        .report-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.2s;
        }

        .report-card:hover {
            border-color: #d4af37;
            transform: translateY(-3px);
        }

        /* ---------- IMAGE ---------- */

        .report-image {
            height: 210px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777777;
            overflow: hidden;
        }

        .report-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            font-size: 45px;
        }

        /* ---------- DETAILS ---------- */

        .report-details {
            padding: 22px;
        }

        .report-category {
            display: inline-block;
            padding: 5px 10px;
            background: #d4af37;
            color: #000000;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .report-details h2 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            margin-bottom: 9px;
            font-size: 14px;
        }

        .detail-label {
            width: 100px;
            color: #888888;
        }

        .detail-value {
            flex: 1;
            color: #dddddd;
        }

        .description {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333333;
        }

        .description-title {
            color: #d4af37;
            font-size: 13px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .description-text {
            color: #bbbbbb;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ---------- STATUS ---------- */

        .status {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #333333;
        }

        .status-label {
            color: #888888;
            font-size: 12px;
        }

        .status-value {
            color: #d4af37;
            font-weight: bold;
            font-size: 13px;
        }

        /* ---------- LOADING / EMPTY ---------- */

        .message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            border: 1px solid #333333;
            border-radius: 10px;
            color: #aaaaaa;
        }

        /* ---------- RESPONSIVE ---------- */

        @media(max-width: 600px) {

            .topbar {
                padding: 0 15px;
            }

            .brand {
                font-size: 16px;
            }

            .page-title {
                display: none;
            }

            .container {
                margin: 30px auto;
                padding: 15px;
            }

            .heading h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ---------- TOP BAR ---------- -->

    <div class="topbar">

        <div class="brand">
            Campus Lost & Found
        </div>

        <div class="page-title">
            My Lost Reports
        </div>

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
        >
            ← Back
        </button>

    </div>


    <!-- ---------- MAIN ---------- -->

    <div class="container">

        <div class="heading">

            <h1>
                My Lost Reports
            </h1>

            <p>
                Lost items reported by you.
            </p>

        </div>


        <div
            id="reportsContainer"
            class="reports-grid"
        >

            <div class="message">
                Loading your lost reports...
            </div>

        </div>

    </div>


    <script>

        // ==================================================
        // LOAD MY LOST REPORTS
        // ==================================================

        async function loadLostReports()
        {
            try
            {

                const currentUser =
                    JSON.parse(
                        sessionStorage.getItem(
                            "campusCurrentUser"
                        ) || "{}"
                    );


                console.log(
                    "📋 Current user:",
                    currentUser
                );


                // ------------------------------------------
                // CHECK LOGIN
                // ------------------------------------------

                if(!currentUser.id)
                {
                    document.getElementById(
                        "reportsContainer"
                    ).innerHTML =
                        `
                        <div class="message">

                            Please login first.

                        </div>
                        `;

                    return;
                }


                // ------------------------------------------
                // REQUEST ONLY THIS USER'S REPORTS
                // ------------------------------------------

                const response =
                    await fetch(
                        `/lost-reports/user/${currentUser.id}`
                    );


                const data =
                    await response.json();


                console.log(
                    "📋 My lost reports:",
                    data
                );


                if(
                    !response.ok ||
                    !data.success
                )
                {
                    throw new Error(
                        "Failed to load lost reports"
                    );
                }


                const reports =
                    data.reports || [];


                const container =
                    document.getElementById(
                        "reportsContainer"
                    );


                container.innerHTML = "";


                // ------------------------------------------
                // NO REPORTS
                // ------------------------------------------

                if(reports.length === 0)
                {
                    container.innerHTML =
                        `
                        <div class="message">

                            You have not submitted
                            any lost reports yet.

                        </div>
                        `;

                    return;
                }


                // ------------------------------------------
                // DISPLAY REPORTS
                // ------------------------------------------

                reports.forEach(
                    report =>
                    {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "report-card";


                        // IMAGE

                        let imageHTML =
                            `
                            <div class="no-image">
                                🔍
                            </div>
                            `;


                        if(report.image_data)
                        {
                            imageHTML =
                                `
                                <img
                                    src="${report.image_data}"
                                    alt="Lost item"
                                >
                                `;
                        }


                        // DETAILS

                        card.innerHTML =
                            `
                            <div class="report-image">

                                ${imageHTML}

                            </div>


                            <div class="report-details">

                                <span
                                    class="report-category"
                                >
                                    ${
                                        report.category ||
                                        "Others"
                                    }
                                </span>


                                <h2>
                                    ${
                                        report.item_type ||
                                        "Lost Item"
                                    }
                                </h2>


                                <div class="detail-row">

                                    <div class="detail-label">
                                        Color
                                    </div>

                                    <div class="detail-value">
                                        ${
                                            report.color ||
                                            "—"
                                        }
                                    </div>

                                </div>


                                <div class="detail-row">

                                    <div class="detail-label">
                                        Brand
                                    </div>

                                    <div class="detail-value">
                                        ${
                                            report.brand ||
                                            "—"
                                        }
                                    </div>

                                </div>


                                <div class="detail-row">

                                    <div class="detail-label">
                                        Location
                                    </div>

                                    <div class="detail-value">
                                        ${
                                            report.location ||
                                            "—"
                                        }
                                    </div>

                                </div>


                                <div class="detail-row">

                                    <div class="detail-label">
                                        Date
                                    </div>

                                    <div class="detail-value">
                                        ${
                                            report.date_lost ||
                                            "—"
                                        }
                                    </div>

                                </div>


                                <div class="detail-row">

                                    <div class="detail-label">
                                        Time
                                    </div>

                                    <div class="detail-value">
                                        ${
                                            report.time_lost ||
                                            "—"
                                        }
                                    </div>

                                </div>


                                <div class="description">

                                    <div
                                        class="description-title"
                                    >
                                        Description
                                    </div>

                                    <div
                                        class="description-text"
                                    >
                                        ${
                                            report.description ||
                                            "No description provided."
                                        }
                                    </div>

                                </div>


                                <div class="status">

                                    <span
                                        class="status-label"
                                    >
                                        Status:
                                    </span>

                                    <span
                                        class="status-value"
                                    >
                                        ${
                                            report.status ||
                                            "OPEN"
                                        }
                                    </span>

                                </div>

                            </div>
                            `;


                        container.appendChild(
                            card
                        );

                    }
                );

            }
            catch(error)
            {

                console.error(
                    "❌ Lost reports error:",
                    error
                );


                document.getElementById(
                    "reportsContainer"
                ).innerHTML =
                    `
                    <div class="message">

                        Unable to load your
                        lost reports.

                    </div>
                    `;

            }
        }


        // ==================================================
        // BACK
        // ==================================================

        function goBack()
        {
            window.location.href =
                "view-reports.html";
        }


        // ==================================================
        // START
        // ==================================================

        loadLostReports();

    </script>


</body>

</html>
