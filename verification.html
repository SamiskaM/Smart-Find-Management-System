<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ownership Verification | Campus Lost & Found</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #182131 0%,
                    #0a0e14 55%,
                    #06080c 100%
                );

            color: #f3ead0;
        }


        /* ==========================================
           TOP BAR
        ========================================== */

        .topbar {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding:
                15px 35px;

            border-bottom:
                1px solid
                rgba(232,196,104,.18);

            background:
                rgba(8,12,18,.92);
        }


        .brand {
            color: #e8c468;

            font-size: 18px;

            font-weight: 700;
        }


        .subtitle {
            color: #8f9aaa;

            font-size: 12px;

            margin-top: 4px;
        }


        .back-btn {
            border:
                1px solid
                rgba(232,196,104,.35);

            background:
                rgba(232,196,104,.08);

            color: #e8c468;

            padding:
                10px 16px;

            border-radius: 8px;

            cursor: pointer;
        }


        .back-btn:hover {
            background:
                rgba(232,196,104,.15);
        }


        /* ==========================================
           MAIN
        ========================================== */

        .container {
            width:
                min(850px, 92%);

            margin:
                50px auto;
        }


        .title {
            font-size: 28px;

            margin-bottom: 10px;
        }


        .description {
            color: #8f9aaa;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* ==========================================
           CARD
        ========================================== */

        .verification-card {
            background:
                rgba(14,21,32,.88);

            border:
                1px solid
                rgba(232,196,104,.22);

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 18px 45px
                rgba(0,0,0,.35);
        }


        /* ==========================================
           ROUND
        ========================================== */

        .round-title {
            color: #e8c468;

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .round-description {
            color: #8f9aaa;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* ==========================================
           INFO
        ========================================== */

        .info-box {
            padding: 16px;

            margin-bottom: 25px;

            border-radius: 10px;

            background:
                rgba(232,196,104,.05);

            border:
                1px solid
                rgba(232,196,104,.15);

            color: #b8bec9;

            font-size: 13px;

            line-height: 1.6;
        }


        /* ==========================================
           QUESTION
        ========================================== */

        .question {
            padding: 20px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,.08);
        }


        .question:last-child {
            border-bottom: none;
        }


        .question-number {
            color: #e8c468;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .question-text {
            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 12px;

            overflow-wrap:
                anywhere;
        }


        .answer-input {
            width: 100%;

            min-height: 48px;

            padding:
                12px 14px;

            border-radius: 8px;

            border:
                1px solid
                rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.04);

            color: #f3ead0;

            outline: none;

            font-size: 14px;

            resize: vertical;
        }


        .answer-input:focus {
            border-color:
                rgba(232,196,104,.55);

            background:
                rgba(255,255,255,.06);
        }


        .answer-input::placeholder {
            color: #687180;
        }


        /* ==========================================
           SUBMIT
        ========================================== */

        .submit-btn {
            width: 100%;

            margin-top: 30px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    155deg,
                    #e8c468,
                    #b99543
                );

            color: #160f04;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }


        .submit-btn:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(232,196,104,.15);
        }


        .submit-btn:disabled {
            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        .message {
            text-align: center;

            color: #8f9aaa;

            padding: 35px;

            line-height: 1.7;
        }


        .success-message {
            text-align: center;

            padding: 30px;

            border-radius: 12px;

            background:
                rgba(232,196,104,.05);

            border:
                1px solid
                rgba(232,196,104,.18);

            color: #b8bec9;

            line-height: 1.7;
        }


        .success-title {
            color: #e8c468;

            font-size: 22px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .topbar {
                padding:
                    15px 18px;
            }


            .container {
                margin:
                    30px auto;
            }


            .verification-card {
                padding: 20px;
            }


            .title {
                font-size: 24px;
            }


            .round-title {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         TOP BAR
    ========================================== -->

    <header class="topbar">

        <div>

            <div class="brand">
                Campus Lost & Found
            </div>

            <div class="subtitle">
                Ownership Verification
            </div>

        </div>


        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
        >
            ← Back
        </button>

    </header>



    <!-- ==========================================
         MAIN
    ========================================== -->

    <main class="container">

        <div class="title">
            Ownership Verification
        </div>


        <div class="description">

            Please answer the questions provided by the
            Founder to prove that you are the rightful owner
            of the lost item.

        </div>


        <div
            class="verification-card"
            id="verificationCard"
        >

            <div class="message">
                Loading verification questions...
            </div>

        </div>

    </main>



    <script>

        let verificationId = null;

        let currentUser = null;

        let verificationData = null;

        let currentRound = null;



        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value)
        {
            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }



        /* ==========================================
           BACK
        ========================================== */

        function goBack()
        {
            window.location.href =
                "profileview.html#dashboard";
        }



        /* ==========================================
           LOAD VERIFICATION
        ========================================== */

        async function loadVerification()
        {

            const card =
                document.getElementById(
                    "verificationCard"
                );


            try
            {

                /* ======================================
                   GET VERIFICATION ID
                ====================================== */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                verificationId =
                    params.get(
                        "verification_id"
                    );


                if(!verificationId)
                {

                    card.innerHTML = `

                        <div class="message">

                            Verification ID not found.

                        </div>

                    `;

                    return;
                }



                /* ======================================
                   GET CURRENT USER
                ====================================== */

                currentUser =
                    JSON.parse(
                        sessionStorage.getItem(
                            "campusCurrentUser"
                        ) || "{}"
                    );


                if(!currentUser.id)
                {

                    card.innerHTML = `

                        <div class="message">

                            User information not found.

                            <br><br>

                            Please log in again.

                        </div>

                    `;

                    return;
                }



                /* ======================================
                   GET VERIFICATION FROM BACKEND
                ====================================== */

                const response =
                    await fetch(
                        `/verification/${encodeURIComponent(
                            verificationId
                        )}`
                    );


                const data =
                    await response.json();


                if(
                    !response.ok ||
                    !data.success
                )
                {

                    throw new Error(
                        data.error ||
                        "Unable to load verification."
                    );

                }


                verificationData =
                    data;



                /* ======================================
                   DETERMINE ROUND
                ====================================== */

                /*
                 * ORIGINAL ROUND:
                 *
                 * status is not ANSWERED
                 *
                 * EXTRA ROUND:
                 *
                 * original is already ANSWERED
                 * and extra_status is SENT
                 */

                if(
                    data.status !==
                    "ANSWERED"
                )
                {

                    if(
                        !Array.isArray(
                            data.questions
                        ) ||
                        data.questions.length === 0
                    )
                    {

                        card.innerHTML = `

                            <div class="message">

                                No verification questions
                                are available.

                            </div>

                        `;

                        return;
                    }


                    currentRound =
                        "ORIGINAL";


                    renderOriginalQuestions(
                        data.questions
                    );

                    return;
                }



                /* ======================================
                   EXTRA ROUND
                ====================================== */

                if(
                    data.extra_status ===
                    "SENT"
                )
                {

                    if(
                        !Array.isArray(
                            data.extra_questions
                        ) ||
                        data.extra_questions.length === 0
                    )
                    {

                        card.innerHTML = `

                            <div class="message">

                                No additional questions
                                are available.

                            </div>

                        `;

                        return;
                    }


                    currentRound =
                        "EXTRA";


                    renderExtraQuestions(
                        data.extra_questions
                    );

                    return;
                }



                /* ======================================
                   EVERYTHING ALREADY COMPLETED
                ====================================== */

                card.innerHTML = `

                    <div class="success-message">

                        <div class="success-title">
                            Verification Completed
                        </div>

                        Your ownership verification
                        answers have already been submitted.

                        <br><br>

                        Please wait for the Founder
                        to review your answers.

                    </div>

                `;

            }
            catch(error)
            {

                console.error(
                    "Verification loading error:",
                    error
                );


                card.innerHTML = `

                    <div class="message">

                        Unable to load verification.

                        <br><br>

                        ${escapeHTML(
                            error.message ||
                            "Please try again."
                        )}

                    </div>

                `;

            }

        }



        /* ==========================================
           ORIGINAL QUESTIONS
        ========================================== */

        function renderOriginalQuestions(
            questions
        )
        {

            const card =
                document.getElementById(
                    "verificationCard"
                );


            let html = `

                <div class="round-title">

                    Ownership Verification

                </div>


                <div class="round-description">

                    The Founder has started ownership
                    verification for your claimed item.

                    <br><br>

                    Answer all questions as accurately
                    as possible.

                </div>


                <div class="info-box">

                    These questions are based on private
                    information provided by the Founder.
                    Your answers will be checked against
                    the original verification answers.

                </div>

            `;



            questions.forEach(
                (item, index) =>
                {

                    html += `

                        <div class="question">

                            <div class="question-number">

                                QUESTION ${index + 1}

                            </div>


                            <div class="question-text">

                                ${escapeHTML(
                                    item.question ||
                                    ""
                                )}

                            </div>


                            <textarea
                                class="answer-input"
                                id="answer-${index}"
                                placeholder="Enter your answer"
                                rows="2"
                            ></textarea>

                        </div>

                    `;

                }
            );



            html += `

                <button
                    type="button"
                    class="submit-btn"
                    id="submitButton"
                    onclick="submitAnswers()"
                >

                    Submit Verification Answers

                </button>

            `;


            card.innerHTML =
                html;

        }



        /* ==========================================
           EXTRA QUESTIONS
        ========================================== */

        function renderExtraQuestions(
            questions
        )
        {

            const card =
                document.getElementById(
                    "verificationCard"
                );


            let html = `

                <div class="round-title">

                    Additional Verification

                </div>


                <div class="round-description">

                    The Founder needs some additional
                    proof of ownership.

                    <br><br>

                    Please answer only the new questions
                    shown below.

                </div>


                <div class="info-box">

                    <strong>
                        Additional Verification Round
                    </strong>

                    <br><br>

                    Your original verification questions
                    have already been completed.

                    They are not shown again.

                    <br><br>

                    Only the new questions below will
                    be evaluated in this round.

                </div>

            `;



            questions.forEach(
                (item, index) =>
                {

                    html += `

                        <div class="question">

                            <div class="question-number">

                                ADDITIONAL QUESTION
                                ${index + 1}

                            </div>


                            <div class="question-text">

                                ${escapeHTML(
                                    item.question ||
                                    ""
                                )}

                            </div>


                            <textarea
                                class="answer-input"
                                id="answer-${index}"
                                placeholder="Enter your answer"
                                rows="2"
                            ></textarea>

                        </div>

                    `;

                }
            );



            html += `

                <button
                    type="button"
                    class="submit-btn"
                    id="submitButton"
                    onclick="submitAnswers()"
                >

                    Submit Additional Answers

                </button>

            `;


            card.innerHTML =
                html;

        }



        /* ==========================================
           SUBMIT ANSWERS
        ========================================== */

        async function submitAnswers()
        {

            if(
                !verificationId ||
                !currentUser ||
                !currentUser.id
            )
            {

                alert(
                    "Verification or user information is missing."
                );

                return;
            }



            if(
                !verificationData
            )
            {

                alert(
                    "Verification data is not loaded."
                );

                return;
            }



            const questions =
                currentRound === "EXTRA"
                    ? (
                        verificationData.extra_questions ||
                        []
                    )
                    : (
                        verificationData.questions ||
                        []
                    );



            if(
                questions.length === 0
            )
            {

                alert(
                    "No questions are available."
                );

                return;
            }



            /* ======================================
               COLLECT ANSWERS
            ====================================== */

            const answers = [];


            for(
                let i = 0;
                i < questions.length;
                i++
            )
            {

                const input =
                    document.getElementById(
                        `answer-${i}`
                    );


                const answer =
                    input
                        ? input.value.trim()
                        : "";


                if(!answer)
                {

                    alert(
                        `Please answer Question ${i + 1}.`
                    );


                    if(input)
                    {
                        input.focus();
                    }


                    return;
                }


                answers.push(
                    answer
                );

            }



            /* ======================================
               CONFIRM SUBMISSION
            ====================================== */

            const confirmed =
                window.confirm(
                    currentRound === "EXTRA"
                        ? "Submit your additional verification answers?"
                        : "Submit your verification answers?"
                );


            if(!confirmed)
            {
                return;
            }



            const button =
                document.getElementById(
                    "submitButton"
                );


            if(button)
            {

                button.disabled =
                    true;

                button.textContent =
                    "Submitting...";

            }



            try
            {

                /* ======================================
                   BACKEND SUBMISSION
                ====================================== */

                const response =
                    await fetch(
                        `/verification/${encodeURIComponent(
                            verificationId
                        )}/submit`,
                        {
                            method:
                                "POST",

                            headers:
                            {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    user_id:
                                        currentUser.id,

                                    answers:
                                        answers,

                                    round:
                                        currentRound

                                })

                        }
                    );


                const data =
                    await response.json();


                if(
                    !response.ok ||
                    !data.success
                )
                {

                    throw new Error(
                        data.message ||
                        data.error ||
                        "Unable to submit answers."
                    );

                }



                /* ======================================
                   ORIGINAL ROUND SUCCESS
                ====================================== */

                if(
                    currentRound ===
                    "ORIGINAL"
                )
                {

                    document.getElementById(
                        "verificationCard"
                    ).innerHTML = `

                        <div class="success-message">

                            <div class="success-title">

                                Verification Submitted

                            </div>

                            Your ownership verification
                            answers have been submitted
                            successfully.

                            <br><br>

                            Your answers are now being
                            reviewed by the Founder.

                            <br><br>

                            Please wait for the Founder
                            to decide whether ownership
                            should be confirmed or whether
                            additional questions are needed.

                        </div>

                    `;

                    return;
                }



                /* ======================================
                   EXTRA ROUND SUCCESS
                ====================================== */

                document.getElementById(
                    "verificationCard"
                ).innerHTML = `

                    <div class="success-message">

                        <div class="success-title">

                            Additional Verification Submitted

                        </div>

                        Your additional verification
                        answers have been submitted
                        successfully.

                        <br><br>

                        Only the new additional questions
                        were evaluated in this round.

                        <br><br>

                        Your original verification
                        answers and score remain unchanged.

                        <br><br>

                        Please wait for the Founder
                        to review the additional answers.

                    </div>

                `;

            }
            catch(error)
            {

                console.error(
                    "Verification submission error:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to submit verification answers."
                );


                if(button)
                {

                    button.disabled =
                        false;

                    button.textContent =
                        currentRound === "EXTRA"
                            ? "Submit Additional Answers"
                            : "Submit Verification Answers";

                }

            }

        }



        /* ==========================================
           START
        ========================================== */

        loadVerification();

    </script>

</body>

</html>
